# Publishes the SecondRead prototype to GitHub Pages on every push to main.
#
# The site is plain static files — no build step, no dependencies. The only
# thing that needs care is `_ds/`: Pages runs Jekyll by default, and Jekyll
# silently drops directories whose name starts with an underscore, which would
# take the whole design system with it. The `.nojekyll` file in the site root
# is what stops that.
name: Deploy SecondRead to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: SecondRead/design_handoff_secondread/design

      - id: deployment
        uses: actions/deploy-pages@v4
